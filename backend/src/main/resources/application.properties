# Uygulama adı.
spring.application.name=todo

# tododb veritabanını bellekte çalıştırır; veriler kalıcı değildir.
spring.datasource.url=jdbc:h2:mem:tododb
spring.datasource.driver-class-name=org.h2.Driver

# H2 konsolu kapalıdır.
spring.h2.console.enabled=false

# Yalnızca geçici geliştirme ve öğrenme ortamı içindir; Hibernate tabloları başlangıçta oluşturur, kapanışta siler.
spring.jpa.hibernate.ddl-auto=create-drop

# SQL betikleriyle otomatik şema ve veri yüklemeyi kapatır.
spring.sql.init.mode=never
